name: Serverless CDK Validate

on:
  pull_request:
    branches:
      - dev
      - tst
      - prod
  push:
    branches:
      - dev
      - tst
      - prod

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate-cdk:
    name: Validate Serverless CDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./infra/cognito

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/cognito/package-lock.json

      - run: npm ci
      - run: npm --prefix ../../frontend ci
      - run: npm --prefix ../../frontend run build
      - run: npm run validate:serverless
