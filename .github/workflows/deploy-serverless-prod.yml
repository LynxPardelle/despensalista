name: Deploy Serverless Prod

on:
  workflow_dispatch:
    inputs:
      backend_only:
        description: Deploy the production backend stack for closed Checkout billing setup
        type: boolean
        default: false
  push:
    branches:
      - prod

permissions: {}

concurrency:
  group: serverless-prod
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  guard:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      source_run_id: ${{ steps.source.outputs.source_run_id }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Require tst merge and locate its release
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = prod
          git fetch origin tst prod
          parent_count="$(git rev-list --parents -n 1 HEAD | awk '{print NF-1}')"
          test "$parent_count" -eq 2
          source_sha="$(git rev-list --parents -n 1 HEAD | awk '{print $3}')"
          git merge-base --is-ancestor "$source_sha" origin/tst
          git diff --quiet "$source_sha" HEAD -- .
          source_run_id="$(gh run list \
            --workflow deploy-serverless-tst.yml \
            --commit "$source_sha" \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')"
          test -n "$source_run_id"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "source_run_id=$source_run_id" >> "$GITHUB_OUTPUT"

  deploy:
    needs: guard
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      PLUS_RENEWAL_NOTICE_MODE: ${{ vars.PLUS_RENEWAL_NOTICE_MODE || 'off' }}
      STRIPE_BILLING_BACKEND_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.backend_only }}
      STRIPE_BILLING_BOUNDARY_ENABLED: ${{ vars.ENABLE_STRIPE_BILLING_BOUNDARY || 'false' }}
      STRIPE_BILLING_ENABLED: ${{ vars.ENABLE_STRIPE_BILLING || 'false' }}
      STRIPE_BILLING_CHECKOUT_ENABLED: ${{ vars.ENABLE_STRIPE_BILLING_CHECKOUT || 'false' }}
      STRIPE_BILLING_VAT_RATE_ID: ${{ vars.STRIPE_BILLING_VAT_RATE_ID }}
      CFDI_REQUEST_RECIPIENT: ${{ secrets.CFDI_REQUEST_RECIPIENT }}
      STRIPE_BILLING_PUBLIC_CHECKOUT: ${{ vars.ENABLE_PUBLIC_PLUS_CHECKOUT || 'false' }}
      STRIPE_BILLING_PILOT_HOUSEHOLD_ID: ${{ vars.PLUS_PILOT_HOUSEHOLD_ID }}
      STRIPE_BILLING_EXTERNAL_BOUNDARY: ${{ vars.STRIPE_BILLING_BOUNDARY_EXTERNALLY_MANAGED || 'false' }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download tst immutable release
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: despensalista-release-${{ needs.guard.outputs.source_sha }}
          path: .release
          github-token: ${{ github.token }}
          run-id: ${{ needs.guard.outputs.source_run_id }}

      - name: Verify and apply releaseId
        run: |
          set -euo pipefail
          node .github/scripts/release-artifact.mjs verify --artifact .release
          node .github/scripts/release-artifact.mjs apply --artifact .release --workspace .

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/cognito/package-lock.json

      - name: Install deployment dependencies
        run: npm --prefix infra/cognito ci

      - name: Validate deploy inputs
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          APP_DOMAIN_NAME: ${{ vars.APP_DOMAIN_NAME || 'despensalista.lynxpardelle.com' }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          COGNITO_DOMAIN_PREFIX: ${{ vars.COGNITO_DOMAIN_PREFIX }}
          PUBLIC_DOMAIN_ENABLED: ${{ vars.ENABLE_PUBLIC_PRODUCTION_DOMAIN || 'false' }}
          PUBLIC_CERTIFICATE_ARN: ${{ vars.PUBLIC_PRODUCTION_CERTIFICATE_ARN }}
        run: |
          set -euo pipefail
          test -n "$AWS_ROLE_ARN"
          test -n "$APP_DOMAIN_NAME"
          test -n "$AWS_REGION"
          test -n "$COGNITO_DOMAIN_PREFIX"
          case "$PUBLIC_DOMAIN_ENABLED" in
            true)
              test "$APP_DOMAIN_NAME" = despensalista.lynxpardelle.com
              test "$AWS_REGION" = us-east-1
              [[ "$PUBLIC_CERTIFICATE_ARN" =~ ^arn:aws:acm:us-east-1:[0-9]{12}:certificate/[a-f0-9-]{36}$ ]]
              ;;
            false) ;;
            *) echo "ENABLE_PUBLIC_PRODUCTION_DOMAIN must be true or false" >&2; exit 1 ;;
          esac
          for flag in STRIPE_BILLING_BOUNDARY_ENABLED STRIPE_BILLING_ENABLED STRIPE_BILLING_CHECKOUT_ENABLED STRIPE_BILLING_EXTERNAL_BOUNDARY; do
            case "${!flag}" in
              true|false) ;;
              *) echo "$flag must be true or false" >&2; exit 1 ;;
            esac
          done
          if [[ "$STRIPE_BILLING_ENABLED" == true ]]; then
            test "$PUBLIC_DOMAIN_ENABLED" = true
            test "$STRIPE_BILLING_BOUNDARY_ENABLED" = true
          fi
          if [[ "$STRIPE_BILLING_CHECKOUT_ENABLED" == true ]]; then
            test "$STRIPE_BILLING_ENABLED" = true
            [[ "$STRIPE_BILLING_VAT_RATE_ID" =~ ^txr_[A-Za-z0-9]+$ ]]
            test -n "$CFDI_REQUEST_RECIPIENT"
          fi
          if [[ "$STRIPE_BILLING_CHECKOUT_ENABLED" == true ]]; then
            [[ "$STRIPE_BILLING_PUBLIC_CHECKOUT" =~ ^(true|false)$ ]]
            if [[ "$STRIPE_BILLING_PUBLIC_CHECKOUT" == true ]]; then
              test -z "$STRIPE_BILLING_PILOT_HOUSEHOLD_ID"
              test "${PLUS_RENEWAL_NOTICE_MODE:-off}" = ses
            else
              [[ "$STRIPE_BILLING_PILOT_HOUSEHOLD_ID" =~ ^[a-f0-9]{8}-[a-f0-9]{4}-4[a-f0-9]{3}-[89ab][a-f0-9]{3}-[a-f0-9]{12}$ ]]
            fi
          fi
          if [[ "$STRIPE_BILLING_BACKEND_ONLY" == true ]]; then
            test "$STRIPE_BILLING_ENABLED" = true
            test "$STRIPE_BILLING_BOUNDARY_ENABLED" = true
            test "$STRIPE_BILLING_CHECKOUT_ENABLED" = false
          fi
          if [[ "$STRIPE_BILLING_EXTERNAL_BOUNDARY" == true ]]; then
            test "$STRIPE_BILLING_BOUNDARY_ENABLED" = true
          fi
          case "$PLUS_RENEWAL_NOTICE_MODE" in
            off) ;;
            dry-run|ses)
              test "$STRIPE_BILLING_ENABLED" = true
              test "$AWS_REGION" = us-east-1
              ;;
            *) echo "PLUS_RENEWAL_NOTICE_MODE must be off, dry-run or ses" >&2; exit 1 ;;
          esac

      - uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Verify SES production renewal readiness
        if: env.PLUS_RENEWAL_NOTICE_MODE == 'ses'
        run: |
          set -euo pipefail
          aws sesv2 get-account --region us-east-1 \
            --query '{production:ProductionAccessEnabled,sending:SendingEnabled}' --output json |
            jq -e '.production == true and .sending == true' >/dev/null
          aws sesv2 get-email-identity --region us-east-1 \
            --email-identity despensalista.lynxpardelle.com \
            --query '{verified:VerifiedForSendingStatus,dkimEnabled:DkimAttributes.SigningEnabled,dkimStatus:DkimAttributes.Status}' --output json |
            jq -e '.verified == true and .dkimEnabled == true and .dkimStatus == "SUCCESS"' >/dev/null
          echo 'PLUS_RENEWAL_SES_ACCESS_VERIFIED=true' >> "$GITHUB_ENV"

      - name: Verify the administrator-managed Stripe Billing boundary
        if: env.STRIPE_BILLING_BACKEND_ONLY == 'true' || env.STRIPE_BILLING_EXTERNAL_BOUNDARY == 'true'
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          [[ "$account_id" =~ ^[0-9]{12}$ ]]
          boundary_arn="arn:aws:iam::$account_id:policy/despensalista-prod-runtime-boundary"
          parameter_arn="arn:aws:ssm:$AWS_REGION:$account_id:parameter/despensalista/prod/billing/stripe"
          version="$(aws iam get-policy --policy-arn "$boundary_arn" --query Policy.DefaultVersionId --output text)"
          aws iam get-policy-version --policy-arn "$boundary_arn" --version-id "$version" --query PolicyVersion.Document --output json |
            jq -e --arg resource "$parameter_arn" '.Statement | any(
              .Effect == "Allow" and
              ([.Action] | flatten) == ["ssm:GetParameter"] and
              ([.Resource] | flatten) == [$resource] and
              .Condition == null)' >/dev/null

      - name: Recover an interrupted production writer drain
        run: node .github/scripts/deployment-state.mjs recover-drain prod

      - name: Snapshot current published release
        run: node .github/scripts/deployment-state.mjs capture prod .rollback

      - name: Keep billing available after its first production deployment
        run: |
          set -euo pipefail
          if [[ "$(jq -r '.unavailable // false' .rollback/state.json)" == true ]]; then
            if [[ "$STRIPE_BILLING_CHECKOUT_ENABLED" == true ]]; then
              echo "Deploy and verify live billing with Checkout closed before opening sales." >&2
              exit 1
            fi
            exit 0
          fi
          billing_table="$(aws cloudformation describe-stacks \
            --stack-name despensalista-prod-serverless-backend \
            --query "Stacks[0].Outputs[?OutputKey=='StripeBillingTableName'].OutputValue | [0]" \
            --output text)"
          if [[ "$STRIPE_BILLING_ENABLED" == false && "$billing_table" != None ]]; then
            echo "Production billing is provisioned. Disable only Checkout to preserve cancellations and account deletion." >&2
            exit 1
          fi
          if [[ "$STRIPE_BILLING_CHECKOUT_ENABLED" == true ]]; then
            live_version="$(jq -er '.version' .rollback/state.json)"
            live_billing="$(aws lambda get-function-configuration \
              --function-name despensalista-prod-backend-api --qualifier "$live_version" \
              --query 'Environment.Variables.STRIPE_BILLING_MODE' --output text)"
            if [[ "$billing_table" != despensalista-prod-billing || "$live_billing" != live ]]; then
              echo "Deploy and verify live billing with Checkout closed before opening sales." >&2
              exit 1
            fi
          fi

      - name: Validate infrastructure against AWS
        run: npm --prefix infra/cognito run build

      - name: Arm durable production recovery
        id: arm
        run: node .github/scripts/deployment-state.mjs arm-drain prod .rollback .release

      - name: Drain old Lambda writers and invalidate legacy pantry quotas
        id: drain
        run: |
          set -euo pipefail
          live_version="$(jq -r '.version // empty' .rollback/state.json)"
          published_version="$(jq -r '.deploymentVersion // empty' .rollback/state.json)"
          live_data_contract_version="$(jq -er '.backendDataContractVersion // 0' .rollback/state.json)"
          function_name="$(jq -r '.functionName // empty' .rollback/state.json)"
          if test -z "$function_name"; then
            echo "armed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          quota_schema_version="$(aws cloudformation describe-stacks \
            --stack-name despensalista-prod-serverless-backend \
            --query "Stacks[0].Outputs[?OutputKey=='PantryQuotaSchemaVersion'].OutputValue | [0]" \
            --output text)"
          # Every versioned data contract already uses pantry quota schema 2.
          # A compatible rollback can leave the live alias behind the stack version.
          if test "$quota_schema_version" = "2" &&
            { test "$live_version" = "$published_version" ||
              test "$live_data_contract_version" -ge 1; }; then
            exit 0
          fi
          users_table="$(aws cloudformation describe-stacks \
            --stack-name despensalista-prod-serverless-backend \
            --query "Stacks[0].Outputs[?OutputKey=='DynamoDbUsersTable'].OutputValue | [0]" \
            --output text)"
          aws dynamodb scan \
            --table-name "$users_table" \
            --consistent-read \
            --filter-expression '#entityType = :quota AND (attribute_not_exists(#deleting) OR #deleting = :notDeleting)' \
            --expression-attribute-names '{"#entityType":"entityType","#deleting":"deleting"}' \
            --expression-attribute-values '{":quota":{"S":"PANTRY_QUOTA"},":notDeleting":{"BOOL":false}}' \
            --projection-expression pk \
            --query 'Items[].pk.S' \
            --output json |
            jq -r '.[]' |
            while IFS= read -r pk; do
              key="$(jq -cn --arg pk "$pk" '{pk:{S:$pk}}')"
              aws dynamodb delete-item \
                --table-name "$users_table" \
                --key "$key" \
                --condition-expression '#entityType = :quota AND (attribute_not_exists(#deleting) OR #deleting = :notDeleting)' \
                --expression-attribute-names '{"#entityType":"entityType","#deleting":"deleting"}' \
                --expression-attribute-values '{":quota":{"S":"PANTRY_QUOTA"},":notDeleting":{"BOOL":false}}' \
                >/dev/null
            done

      - name: Deploy prod releaseId
        id: deploy
        working-directory: infra/cognito
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          APP_DOMAIN_NAME: ${{ vars.APP_DOMAIN_NAME || 'despensalista.lynxpardelle.com' }}
          COGNITO_DOMAIN_PREFIX: ${{ vars.COGNITO_DOMAIN_PREFIX }}
          PUBLIC_DOMAIN_ENABLED: ${{ vars.ENABLE_PUBLIC_PRODUCTION_DOMAIN || 'false' }}
          PUBLIC_CERTIFICATE_ARN: ${{ vars.PUBLIC_PRODUCTION_CERTIFICATE_ARN }}
        run: |
          set -euo pipefail
          FRONTEND_BASE_URL="https://$APP_DOMAIN_NAME"
          RELEASE_ID="$(jq -r '.releaseId' ../../.release/release-manifest.json)"
          test "$(printf '%s' "$RELEASE_ID" | grep -Ec '^[0-9a-f]{12}$')" -eq 1
          public_domain_context=()
          if [[ "$PUBLIC_DOMAIN_ENABLED" == true ]]; then
            public_domain_context=(
              --context enablePublicProductionDomain=true
              --context publicProductionCertificateArn="$PUBLIC_CERTIFICATE_ARN"
            )
          fi
          deploy_target=(--all)
          if [[ "$STRIPE_BILLING_BACKEND_ONLY" == true ]]; then
            deploy_target=(despensalista-prod-serverless-backend --exclusively)
          fi
          npx cdk deploy "${deploy_target[@]}" --require-approval never --change-set-name despensalista-prod-release \
            --context projectName=despensalista \
            --context stage=prod \
            --context awsRegion="$AWS_REGION" \
            --context includeServerlessBackend=true \
            --context releaseId="$RELEASE_ID" \
            --context backendArtifactPath=../../backend/lambda.zip \
            --context removalPolicy=retain \
            --context deletionProtection=true \
            --context domainPrefix="$COGNITO_DOMAIN_PREFIX" \
            --context appDomainName="$APP_DOMAIN_NAME" \
            --context productionFrontendBaseUrl="$FRONTEND_BASE_URL" \
            --context serverlessFrontendBaseUrl="$FRONTEND_BASE_URL" \
            --context enableStripeBillingBoundary="$STRIPE_BILLING_BOUNDARY_ENABLED" \
            --context externalStripeBillingBoundary="$STRIPE_BILLING_EXTERNAL_BOUNDARY" \
            --context enableStripeBilling="$STRIPE_BILLING_ENABLED" \
            --context enableStripeBillingCheckout="$STRIPE_BILLING_CHECKOUT_ENABLED" \
            --context stripeBillingVatRateId="$STRIPE_BILLING_VAT_RATE_ID" \
            --context cfdiRequestRecipient="$CFDI_REQUEST_RECIPIENT" \
            --context enablePublicStripeBillingCheckout="$STRIPE_BILLING_PUBLIC_CHECKOUT" \
            --context stripeBillingPilotHouseholdId="$STRIPE_BILLING_PILOT_HOUSEHOLD_ID" \
            --context renewalNoticeMode="$PLUS_RENEWAL_NOTICE_MODE" \
            --context renewalNoticeSesProductionAccess="${PLUS_RENEWAL_SES_ACCESS_VERIFIED:-false}" \
            --context externallyManagedSocialProviders=Google \
            "${public_domain_context[@]}"

      - name: Activate exact backend release while writers remain drained
        id: activate
        run: node .github/scripts/deployment-state.mjs activate-drain prod

      - name: Verify exact backend release while writers remain drained
        id: verify
        run: node .github/scripts/deployment-state.mjs verify prod .release

      - name: Reconcile exact published release
        id: reconcile
        run: node .github/scripts/deployment-state.mjs reconcile prod .release

      - name: Mark reconciled production release verified
        id: mark_drain
        run: node .github/scripts/deployment-state.mjs mark-drain-verified prod

      - name: Restore production Lambda concurrency
        id: release_drain
        if: always() && steps.drain.outcome == 'success' && steps.deploy.outcome == 'success' && steps.activate.outcome == 'success' && steps.verify.outcome == 'success' && steps.reconcile.outcome == 'success' && steps.mark_drain.outcome == 'success'
        run: node .github/scripts/deployment-state.mjs release-drain prod

      - name: Post-deploy smoke
        id: smoke
        env:
          APP_DOMAIN_NAME: ${{ vars.APP_DOMAIN_NAME || 'despensalista.lynxpardelle.com' }}
        run: |
          set -euo pipefail
          feedback_table="$(aws lambda get-function-configuration \
            --function-name despensalista-prod-backend-api --qualifier live \
            --query 'Environment.Variables.FEEDBACK_TABLE' --output text)"
          test "$feedback_table" = despensalista-prod-feedback
          node .github/scripts/smoke.mjs --base-url "https://$APP_DOMAIN_NAME" --attempts 18 --delay-ms 10000 --verify-feedback true
          if [[ "$STRIPE_BILLING_ENABLED" == true ]]; then
            # An unsigned delivery must be rejected after loading the protected settings.
            status="$(curl --silent --show-error --max-time 15 \
              --output /dev/null --write-out '%{http_code}' \
              --header 'Content-Type: application/json' --data '{}' \
              https://despensalista.com/api/billing/webhook)"
            test "$status" = 400
          fi

      - name: Finalize durable production recovery
        run: node .github/scripts/deployment-state.mjs finalize-drain prod

      - name: Restore previous frontend and backend after failed publish or smoke
        if: failure() && (steps.arm.outcome == 'failure' || steps.drain.outcome == 'failure' || steps.deploy.outcome == 'failure' || steps.activate.outcome == 'failure' || steps.verify.outcome == 'failure' || steps.reconcile.outcome == 'failure' || steps.mark_drain.outcome == 'failure' || steps.release_drain.outcome == 'failure' || steps.smoke.outcome == 'failure')
        run: node .github/scripts/deployment-state.mjs restore prod .rollback

      - name: Record exact published deployment
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
        run: node .github/scripts/deployment-state.mjs record prod .release deployment-receipt "$GITHUB_SHA"

      - name: Upload exact rollback receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: despensalista-deployment-prod-${{ github.sha }}
          path: deployment-receipt
          if-no-files-found: error
          retention-days: 90

      - name: Promote unchanged releaseId for rollback
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: despensalista-release-${{ github.sha }}
          path: .release
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

      - name: Record releaseId
        run: >-
          node -e 'const m=require("./.release/release-manifest.json");
          process.stdout.write("### Deployed releaseId "+m.releaseId+" ("+m.sourceSha+")\n")'
          >> "$GITHUB_STEP_SUMMARY"
