name: Deploy Serverless Prod

on:
  workflow_dispatch:
  push:
    branches:
      - prod

permissions: {}

concurrency:
  group: serverless-prod
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  guard:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      source_run_id: ${{ steps.source.outputs.source_run_id }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Require tst merge and locate its release
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = prod
          git fetch origin tst prod
          parent_count="$(git rev-list --parents -n 1 HEAD | awk '{print NF-1}')"
          test "$parent_count" -eq 2
          source_sha="$(git rev-list --parents -n 1 HEAD | awk '{print $3}')"
          git merge-base --is-ancestor "$source_sha" origin/tst
          git diff --quiet "$source_sha" HEAD -- .
          source_run_id="$(gh run list \
            --workflow deploy-serverless-tst.yml \
            --commit "$source_sha" \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')"
          test -n "$source_run_id"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "source_run_id=$source_run_id" >> "$GITHUB_OUTPUT"

  deploy:
    needs: guard
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      actions: read
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download tst immutable release
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: despensalista-release-${{ needs.guard.outputs.source_sha }}
          path: .release
          github-token: ${{ github.token }}
          run-id: ${{ needs.guard.outputs.source_run_id }}

      - name: Verify and apply releaseId
        run: |
          set -euo pipefail
          node .github/scripts/release-artifact.mjs verify --artifact .release
          node .github/scripts/release-artifact.mjs apply --artifact .release --workspace .

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/cognito/package-lock.json

      - name: Install deployment dependencies
        run: npm --prefix infra/cognito ci

      - name: Validate deploy inputs
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          APP_DOMAIN_NAME: ${{ vars.APP_DOMAIN_NAME || 'despensalista.lynxpardelle.com' }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          COGNITO_DOMAIN_PREFIX: ${{ vars.COGNITO_DOMAIN_PREFIX }}
        run: |
          set -euo pipefail
          test -n "$AWS_ROLE_ARN"
          test -n "$APP_DOMAIN_NAME"
          test -n "$AWS_REGION"
          test -n "$COGNITO_DOMAIN_PREFIX"

      - uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Snapshot current published release
        run: node .github/scripts/deployment-state.mjs capture prod .rollback

      - name: Validate infrastructure against AWS
        run: npm --prefix infra/cognito run build

      - name: Deploy prod releaseId
        id: deploy
        working-directory: infra/cognito
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          APP_DOMAIN_NAME: ${{ vars.APP_DOMAIN_NAME || 'despensalista.lynxpardelle.com' }}
          COGNITO_DOMAIN_PREFIX: ${{ vars.COGNITO_DOMAIN_PREFIX }}
        run: |
          set -euo pipefail
          FRONTEND_BASE_URL="https://$APP_DOMAIN_NAME"
          npx cdk deploy --all --require-approval never --change-set-name despensalista-prod-release \
            --context projectName=despensalista \
            --context stage=prod \
            --context awsRegion="$AWS_REGION" \
            --context includeServerlessBackend=true \
            --context backendArtifactPath=../../backend/lambda.zip \
            --context removalPolicy=retain \
            --context deletionProtection=true \
            --context domainPrefix="$COGNITO_DOMAIN_PREFIX" \
            --context appDomainName="$APP_DOMAIN_NAME" \
            --context productionFrontendBaseUrl="$FRONTEND_BASE_URL" \
            --context serverlessFrontendBaseUrl="$FRONTEND_BASE_URL" \
            --context externallyManagedSocialProviders=Google

      - name: Reconcile exact published release
        id: reconcile
        run: node .github/scripts/deployment-state.mjs reconcile prod .release

      - name: Post-deploy smoke
        id: smoke
        env:
          APP_DOMAIN_NAME: ${{ vars.APP_DOMAIN_NAME || 'despensalista.lynxpardelle.com' }}
        run: node .github/scripts/smoke.mjs --base-url "https://$APP_DOMAIN_NAME" --attempts 18 --delay-ms 10000

      - name: Restore previous frontend and backend after failed publish or smoke
        if: failure() && (steps.reconcile.outcome == 'failure' || steps.smoke.outcome == 'failure')
        run: node .github/scripts/deployment-state.mjs restore prod .rollback

      - name: Record exact published deployment
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
        run: node .github/scripts/deployment-state.mjs record prod .release deployment-receipt "$GITHUB_SHA"

      - name: Upload exact rollback receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: despensalista-deployment-prod-${{ github.sha }}
          path: deployment-receipt
          if-no-files-found: error
          retention-days: 90

      - name: Promote unchanged releaseId for rollback
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: despensalista-release-${{ github.sha }}
          path: .release
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

      - name: Record releaseId
        run: >-
          node -e 'const m=require("./.release/release-manifest.json");
          process.stdout.write("### Deployed releaseId "+m.releaseId+" ("+m.sourceSha+")\n")'
          >> "$GITHUB_STEP_SUMMARY"
