name: Rollback Serverless Release

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Environment to restore; dispatch from the matching branch.
        required: true
        type: choice
        options:
          - dev
          - tst
          - prod
      release_sha:
        description: Commit SHA alias of a previously successful stage deployment.
        required: true
        type: string

permissions: {}

concurrency:
  group: serverless-${{ inputs.stage }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  locate-release:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      release_sha: ${{ steps.release.outputs.release_sha }}
      source_run_id: ${{ steps.release.outputs.source_run_id }}
      workflow_name: ${{ steps.release.outputs.workflow_name }}

    steps:
      - name: Validate rollback source
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          STAGE: ${{ inputs.stage }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$STAGE"
          test "$(printf '%s' "$RELEASE_SHA" | grep -Ec '^[0-9a-fA-F]{40}$')" -eq 1
          release_sha="$(printf '%s' "$RELEASE_SHA" | tr '[:upper:]' '[:lower:]')"
          workflow_name="deploy-serverless-${STAGE}.yml"
          source_run_id="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow "$workflow_name" \
            --commit "$release_sha" \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')"
          test -n "$source_run_id"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "source_run_id=$source_run_id" >> "$GITHUB_OUTPUT"
          echo "workflow_name=$workflow_name" >> "$GITHUB_OUTPUT"

  rollback:
    needs: locate-release
    runs-on: ubuntu-latest
    environment: ${{ inputs.stage }}
    permissions:
      actions: read
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download selected releaseId
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: despensalista-release-${{ needs.locate-release.outputs.release_sha }}
          path: .release
          github-token: ${{ github.token }}
          run-id: ${{ needs.locate-release.outputs.source_run_id }}

      - name: Download exact deployment receipt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: despensalista-deployment-${{ inputs.stage }}-${{ needs.locate-release.outputs.release_sha }}
          path: deployment-receipt
          github-token: ${{ github.token }}
          run-id: ${{ needs.locate-release.outputs.source_run_id }}

      - name: Verify and apply selected releaseId
        run: |
          set -euo pipefail
          node .github/scripts/release-artifact.mjs verify --artifact .release
          node .github/scripts/release-artifact.mjs apply --artifact .release --workspace .

      - uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Restore selected published backend version and frontend releaseId
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          RELEASE_SHA: ${{ needs.locate-release.outputs.release_sha }}
          STAGE: ${{ inputs.stage }}
        run: >-
          node .github/scripts/deployment-state.mjs release "$STAGE" .release
          deployment-receipt/deployment-receipt.json "$RELEASE_SHA"

      - name: Post-rollback smoke
        env:
          APP_DOMAIN_NAME: ${{ vars.APP_DOMAIN_NAME }}
          STAGE: ${{ inputs.stage }}
        run: |
          set -euo pipefail
          case "$STAGE" in
            dev) DEFAULT_DOMAIN=dev.despensalista.lynxpardelle.com ;;
            tst) DEFAULT_DOMAIN=test.despensalista.lynxpardelle.com ;;
            prod) DEFAULT_DOMAIN=despensalista.lynxpardelle.com ;;
          esac
          APP_DOMAIN_NAME="${APP_DOMAIN_NAME:-$DEFAULT_DOMAIN}"
          node .github/scripts/smoke.mjs \
            --base-url "https://$APP_DOMAIN_NAME" \
            --attempts 18 \
            --delay-ms 10000

      - name: Record rollback releaseId
        run: >-
          node -e 'const m=require("./.release/release-manifest.json");
          process.stdout.write("### Restored releaseId "+m.releaseId+" ("+m.sourceSha+")\n")'
          >> "$GITHUB_STEP_SUMMARY"
