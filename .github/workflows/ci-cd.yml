name: CI/CD Pipeline

on:
  push:
    branches: [ main, dev, tst, prod ]
  pull_request:
    branches: [ main, dev, tst, prod ]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release-automation:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: 22

    - name: Test release, smoke, and workflow contracts
      run: node --test .github/scripts/*.test.mjs docker/mongodb/replica-health.test.mjs backend/scripts/deployed-api-smoke.test.cjs

    - name: Verify authenticated MongoDB replica-set transactions
      run: bash .github/scripts/mongodb-compose-smoke.sh

  privacy-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        fetch-depth: 0

    - name: Require privacy review for sensitive changes
      env:
        PRIVACY_REVIEW_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        PRIVACY_REVIEW_HEAD: ${{ github.sha }}
      run: node tools/require-privacy-review.mjs --base="$PRIVACY_REVIEW_BASE" --head="$PRIVACY_REVIEW_HEAD"

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        fetch-depth: 0

    - name: Install gitleaks
      run: |
        set -euo pipefail
        curl --fail --show-error --silent --location \
          "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
          --output "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
        curl --fail --show-error --silent --location \
          "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" \
          --output gitleaks_checksums.txt
        grep "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks_checksums.txt | sha256sum --check -
        tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
        sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

    - name: Scan repository secrets
      run: gitleaks detect --source . --redact --verbose --exit-code 1

  codeql:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Initialize CodeQL
      uses: github/codeql-action/init@fddeee1a7ece751b577e409a89057319e3172939 # v4
      with:
        languages: javascript-typescript

    - name: Autobuild
      uses: github/codeql-action/autobuild@fddeee1a7ece751b577e409a89057319e3172939 # v4

    - name: Analyze
      uses: github/codeql-action/analyze@fddeee1a7ece751b577e409a89057319e3172939 # v4

  test-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./frontend
    
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    
    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Install dependencies
      run: npm ci

    - name: Audit runtime dependencies
      run: npm audit --omit=dev --audit-level=moderate

    - name: Run tests
      run: npm run test:ci

    - name: Build application
      run: npm run build

    - name: Install Playwright media dependency
      run: npx playwright install ffmpeg

    - name: Browser user journeys
      run: npm run test:e2e

  test-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./backend
    
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    
    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json
    
    - name: Install dependencies
      run: npm ci

    - name: Audit runtime dependencies
      run: npm audit --omit=dev --audit-level=moderate
    
    - name: Run linting
      run: npm run lint:check
    
    - name: Run tests
      run: npm run test
    
    - name: Run e2e tests
      run: npm run test:e2e
    
    - name: Build application
      run: npm run build

  test-infra:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./infra/cognito

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: infra/cognito/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Audit runtime dependencies
      run: npm audit --omit=dev --audit-level=moderate

    - name: Build infrastructure
      run: npm run build

    - name: Test infrastructure
      run: npm test

  container-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Build backend image
      run: docker build -t despensalista-backend:scan ./backend

    - name: Scan backend image
      uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
      with:
        image-ref: despensalista-backend:scan
        severity: HIGH,CRITICAL
        ignore-unfixed: true
        exit-code: '1'
    - name: Build frontend image
      run: docker build -t despensalista-frontend:scan ./frontend

    - name: Scan frontend image
      uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
      with:
        image-ref: despensalista-frontend:scan
        severity: HIGH,CRITICAL
        ignore-unfixed: true
        exit-code: '1'
