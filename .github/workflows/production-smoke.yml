name: Production Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions: {}

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify production user journey
        run: >-
          node .github/scripts/smoke.mjs
          --base-url https://despensalista.lynxpardelle.com
          --attempts 3
          --delay-ms 5000
